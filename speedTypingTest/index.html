<html>
    <head>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z"
      crossorigin="anonymous"
    />
    <script
      src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
      integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
      integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"
      integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="index.css"/>
  </head>
<body>
     <div class="bg-container d-flex flex-column pt-2">
         <h1 class="heading">Typing Test</h1>
         <p class="description">On Your Fingers , Let's set go..</p>
         <div class="d-flex justify-content-center align-items-center">
            <img src="https://assets.ccbp.in/frontend/dynamic-webapps/clock-img.png" class="img"/>
            <p id="timer" class="time">0</p>
            <span class="seconds">seconds</span>
         </div>
          <div id="spinner" class="d-none mb-3">
                <div class="spinner-border text-warning" role="status"></div>
            </div>

            <p id="quoteDisplay" class="quote-box"></p>
            <textarea id="textInput" rows="3" placeholder="Enter the text" class="type-input"></textarea>

            <p id="result" class="result"></p>
            <div class="text-center">
                <button id="submitBtn" class="btn btn-primary">Submit</button>
                <button class="btn btn-outline-primary" id="resetBtn">Reset</button>
            </div>
     </div>

    <script src="index.js"></script>
</body>
</html>
