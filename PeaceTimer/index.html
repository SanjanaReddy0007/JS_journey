 <div class="bg-container d-flex flex-column justify-content-center text-center">
    <div class="container peace-container">
        <div class="row text-center pt-4">
            <div class="d-flex flex-column justify-content-center mt-4 m-6">
            <h1 class="peace-heading">A Moment Of Peace</h1>
            <p class="peace-para">Turn off your Phone, put off your headphone. and take a moment for yourSelf...</p>
            </div>
            <hr class="col-10"/>
            <h1 class="col-12 heading">How long would you like to your Moment to Be</h1>
            <ul class="col-12 button-list-continer d-flex flex-row justify-content-center">
                <li><button class="button" id="twentySeconds">20 Seconds</button></li>
                <li><button class="button" id="thirtySeconds">30 Seconds</button></li>
                <li><button class="button" id="fourtySeconds">40 Seconds</button></li>
                <li><button class="button" id="oneMinute">30 Seconds</button></li>
            </ul>
            <p class="col-12 text-center" id="timertext"></p>
        </div>
    </div>
 </div>
