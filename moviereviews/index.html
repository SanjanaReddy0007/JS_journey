 <head>

<h1 class="heading">Movie Review</h1>
<div class="container" id="reviewPage">
    <div class="row">
        <div class="col-12">
           <label for="userInput" class="label-input">MOVIE TITLE</label>
           <input type="text" id="userInput" placeholder="Enter Movie Title"/>
        </div>

        <div class="col-12 mt-3">
            <label for="textAreaInput" class="textarea">YOUR REVIEW</label>
            <textarea id="textAreaInput" placeholder="Enter Your Review"></textarea>
        </div>
        <div class="col-12 d-flex justify-content-end">
            <button class="btn btn-primary" id="addBtn" >Add</button>
        </div>

        <div id="reviewContainer"></div>
    </div>
</div>

<script src="index.js"></script>
